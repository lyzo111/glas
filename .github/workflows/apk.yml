# Builds Glas on every push to main and publishes the APK as a release, so the phone can
# update from anywhere. The APK is signed with the same key as the local builds (the secret
# DEBUG_KEYSTORE, base64), otherwise Android would refuse it as an update.
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          # Uploaded from Windows the secret may end in a CR; base64 rejects any whitespace.
          printf '%s' "$KEYSTORE" | tr -d '\r\n\t ' | base64 -d > ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          name="${version%%+*}"
          cp build/app/outputs/flutter-apk/app-release.apk "Glas-$name.apk"
          gh release create "v$version-${{ github.run_number }}" "Glas-$name.apk" \
            --title "Glas $name (Build ${{ github.run_number }})" \
            --notes "Gebaut aus ${{ github.sha }}."
