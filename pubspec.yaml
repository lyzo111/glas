name: glas
description: "Launcher im Stil von iOS."
publish_to: 'none'
version: 2.16.0+32

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wallpapers/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/Inter.ttf
